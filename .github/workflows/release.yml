name: Release RepoDock

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run electron:release:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
